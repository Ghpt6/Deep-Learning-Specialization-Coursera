name: Course environments

on:
  push:
    paths:
      - 'environments/**'
      - 'scripts/**'
      - 'supplements/**'
      - 'tests/**'
      - 'setup.*'
      - '.python-version'
      - 'Course */**/*.py'
      - 'Course */**/*.ipynb'
      - '.github/workflows/environments.yml'
  pull_request:
    paths:
      - 'environments/**'
      - 'scripts/**'
      - 'supplements/**'
      - 'tests/**'
      - 'setup.*'
      - '.python-version'
      - 'Course */**/*.py'
      - 'Course */**/*.ipynb'
      - '.github/workflows/environments.yml'
  workflow_dispatch:

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.24'
          enable-cache: true
          cache-dependency-glob: 'environments/**/uv.lock'
      - name: Test asset download and restoration
        run: uv run --no-project --python 3.10.20 python -m unittest discover -s tests -v
      - name: Windows one-command setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup.ps1
      - name: macOS / Linux one-command setup
        if: runner.os != 'Windows'
        run: bash setup.sh
      - name: Check locked environments again (idempotency)
        shell: bash
        run: bash setup.sh --check-only
