name: Build supplemental asset release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supplemental-asset-release
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.24'
      - name: Restore the original files with their exact checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.10.20 --with requests python scripts/publish_supplement_draft.py seed
      - name: Download missing source files
        run: uv run --python 3.10.20 scripts/download_supplements.py --workers 16
      - name: Verify all inputs and build compressed volumes
        run: uv run --no-project --python 3.10.20 python scripts/build_supplement_release.py
      - name: Verify archive contents and upload the draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.10.20 --with requests python scripts/publish_supplement_draft.py upload
