[project]
name = "dls-course-1"
version = "0.1.0"
description = "Reproducible environment for Deep Learning Specialization, Course 1"
requires-python = ">=3.10,<3.11"
dependencies = [
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "pip==24.3.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "matplotlib==3.7.5",
    "h5py==3.8.0",
    "scikit-learn==1.2.2",
    "pillow==9.5.0",
]

[tool.uv]
package = false
required-version = ">=0.11.24"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
