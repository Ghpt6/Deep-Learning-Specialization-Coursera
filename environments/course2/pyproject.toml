[project]
name = "dls-course-2"
version = "0.1.0"
description = "Reproducible environment for Deep Learning Specialization, Course 2"
requires-python = ">=3.10,<3.11"
dependencies = [
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "pip==24.3.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "matplotlib==3.7.5",
    "h5py==3.8.0",
    "scikit-learn==1.2.2",
    "pillow==9.5.0",
    "tensorflow==2.10.1; sys_platform != \"darwin\" or platform_machine != \"arm64\"",
    "tensorflow-macos==2.10.0; sys_platform == \"darwin\" and platform_machine == \"arm64\"",
    "keras==2.10.0",
    # TensorBoard 2.10 imports pkg_resources, removed in setuptools 82.
    "setuptools==70.3.0",
    "dlai-tools==0.4.0",
]

[tool.uv]
package = false
required-version = ">=0.11.24"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
