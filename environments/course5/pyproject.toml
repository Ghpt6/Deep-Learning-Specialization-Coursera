[project]
name = "dls-course-5"
version = "0.1.0"
description = "Reproducible environment for Deep Learning Specialization, Course 5"
requires-python = ">=3.10,<3.11"
dependencies = [
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "pip==24.3.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "matplotlib==3.7.5",
    "h5py==3.8.0",
    "scikit-learn==1.2.2",
    "pillow==9.5.0",
    "tensorflow==2.10.1; sys_platform != \"darwin\" or platform_machine != \"arm64\"",
    "tensorflow-macos==2.10.0; sys_platform == \"darwin\" and platform_machine == \"arm64\"",
    "keras==2.10.0",
    # TensorBoard 2.10 imports pkg_resources, removed in setuptools 82.
    "setuptools==70.3.0",
    "pandas==1.5.3",
    "termcolor==2.4.0",
    "emoji==0.6.0",
    "babel==2.14.0",
    "faker==8.13.2",
    "mido==1.3.2",
    "music21==6.7.1",
    "pydub==0.25.1",
    "transformers==4.30.2",
    "datasets==2.14.7",
    "pyarrow==14.0.2",
    "torch==2.2.2",
    "accelerate==0.21.0",
    "seqeval==1.2.2",
    "tqdm==4.66.5",
]

[tool.uv]
package = false
required-version = ">=0.11.24"
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
